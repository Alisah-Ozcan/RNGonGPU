name: GPU tests (simulated)

# Optional, non-required check. The runners have no GPU, so this runs the tests
# on a simulated NVIDIA A100 (https://github.com/pantheongpu/pantheonsim).
# A simulator cannot reproduce hardware-specific behaviour or timing, so it
# complements real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  gpu-tests:
    name: tests on a simulated A100
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@23932d9b811269d55c8d65687332fefc65daeb2c # v0.1.3
        with:
          gpu: nvidia/a100
          cuda-toolkit: "13.0"

      - name: Configure
        run: |
          # 80-virtual embeds PTX only: the simulator JIT-compiles PTX and does not run SASS.
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=80-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DRNGonGPU_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      # The stream suites take over 20 minutes on a hosted runner, so only the
      # DRBG vector and large-request tests run here.
      - name: Test
        run: vgpu run ./build/bin/test/test --gtest_filter='*DRBGVECTORS*:*LARGE_REQUEST*'

      - name: Free disk space
        if: always()
        run: |
          df -h /
          rm -rf build
          df -h /
